<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rant Freedom</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Rant Freedom</h1><p><b>rant</b> (noun): a long, loud, passionate speech; to speak at length in an angry or impassioned way.</p></header>
<main><div class="box" id="box">Loading…</div></main>
<footer><a href="./">Archive</a></footer>
<script>fetch('rants/rants.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{const b=document.getElementById('box');if(!a.length){b.innerHTML='<h2>Nothing here yet.</h2>';return}b.innerHTML=a.slice().reverse().map(r=>'<div class="item"><h2>'+new Date(r.date+'T12:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'</h2><audio controls preload="none" src="rants/'+r.file+'"></audio></div>').join('')})</script>
</body></html>
