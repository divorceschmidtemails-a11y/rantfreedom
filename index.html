<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rant Freedom</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Rant Freedom</h1><p><b>rant</b> (noun): a long, loud, passionate speech; to speak at length in an angry or impassioned way.</p></header>
<main><div class="box" id="box">Loading…</div></main>
<footer><a href="archive.html">Archive</a></footer>
<script>fetch('rants/rants.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{const b=document.getElementById('box');if(!a.length){b.innerHTML='<h2>First rant coming soon.</h2>';return}const r=a[a.length-1];b.innerHTML='<h2>'+new Date(r.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</h2><audio controls preload="metadata" src="rants/'+r.file+'"></audio>'}).catch(()=>document.getElementById('box').textContent='First rant coming soon.')</script>
</body></html>
